{{- if .Values.kubeEventsCollector.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openchoreo-data-plane.kubeEventsCollector.name" . }}
  labels:
    {{- include "openchoreo-data-plane.componentLabels" (dict "context" . "component" "kube-events-collector") | nindent 4 }}
rules:
  # Watch and list events across all namespaces
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Get labels from involved objects
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
{{- end }}
