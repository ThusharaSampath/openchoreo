{{- if .Values.kubeEventsCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openchoreo-data-plane.kubeEventsCollector.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-data-plane.componentLabels" (dict "context" . "component" "kube-events-collector") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openchoreo-data-plane.componentSelectorLabels" (dict "context" . "component" "kube-events-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openchoreo-data-plane.componentSelectorLabels" (dict "context" . "component" "kube-events-collector") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openchoreo-data-plane.kubeEventsCollector.serviceAccountName" . }}
      {{- with .Values.kubeEventsCollector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubeEventsCollector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: collector
        image: "{{ .Values.kubeEventsCollector.image.repository }}:{{ .Values.kubeEventsCollector.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.kubeEventsCollector.image.pullPolicy }}
        args:
        - --log-level={{ .Values.kubeEventsCollector.logLevel }}
        - --checkpoint-path=/data/checkpoint.db
        - --checkpoint-max-age={{ .Values.kubeEventsCollector.checkpoint.maxAge }}
        - --checkpoint-cleanup-interval={{ .Values.kubeEventsCollector.checkpoint.cleanupInterval }}
        - --label-cache-ttl={{ .Values.kubeEventsCollector.labelCacheTTL }}
        - --namespace-selector={{ .Values.kubeEventsCollector.namespaceSelector }}
        resources:
          {{- toYaml .Values.kubeEventsCollector.resources | nindent 10 }}
        volumeMounts:
        {{- if .Values.kubeEventsCollector.checkpoint.persistence.enabled }}
        - name: checkpoint-data
          mountPath: /data
        {{- else }}
        - name: checkpoint-data-emptydir
          mountPath: /data
        {{- end }}
      volumes:
      {{- if .Values.kubeEventsCollector.checkpoint.persistence.enabled }}
      - name: checkpoint-data
        persistentVolumeClaim:
          claimName: {{ include "openchoreo-data-plane.kubeEventsCollector.name" . }}-checkpoint
      {{- else }}
      - name: checkpoint-data-emptydir
        emptyDir: {}
      {{- end }}
{{- end }}
