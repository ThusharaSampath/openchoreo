{{- if .Values.kubeEventsCollector.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openchoreo-data-plane.kubeEventsCollector.name" . }}
  labels:
    {{- include "openchoreo-data-plane.componentLabels" (dict "context" . "component" "kube-events-collector") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openchoreo-data-plane.kubeEventsCollector.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openchoreo-data-plane.kubeEventsCollector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
