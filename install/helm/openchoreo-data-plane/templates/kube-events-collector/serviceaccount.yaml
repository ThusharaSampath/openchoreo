{{- if .Values.kubeEventsCollector.enabled }}
{{- if .Values.kubeEventsCollector.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openchoreo-data-plane.kubeEventsCollector.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openchoreo-data-plane.componentLabels" (dict "context" . "component" "kube-events-collector") | nindent 4 }}
{{- end }}
{{- end }}
